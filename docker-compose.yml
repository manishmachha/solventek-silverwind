# Docker Compose for Silverwind - Development Environment
version: "3.8"

services:
  # MariaDB Database
  db:
    image: mariadb:11.7.2
    container_name: silverwind-db
    environment:
      MARIADB_DATABASE: solventek_silverwind
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - silverwind-network

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: silverwind-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-s", "http://localhost:6333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - silverwind-network

  # Spring Boot Backend
  backend:
    build:
      context: ./silverwind-backend
      dockerfile: Dockerfile
    container_name: silverwind-backend
    environment:
      # Database
      SPRING_DATASOURCE_URL: jdbc:mariadb://db:3306/solventek_silverwind
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-root}
      # AWS S3 (disabled by default for local dev)
      AWS_S3_ENABLED: ${AWS_S3_ENABLED:-false}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-solventek-silverwind}
      AWS_REGION: ${AWS_REGION:-eu-north-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      # JWT
      APP_JWT_SECRET: ${JWT_SECRET:-9a4f2c8d3b7a1e6f4a5d0c3b2a1e9d8c7b6a5e4d2a1b9c8d3e5f7a0c1b4d2e6f}
      # Google AI (optional)
      SPRING_AI_GOOGLE_GENAI_API_KEY: ${GOOGLE_AI_API_KEY:-}
    ports:
      - "9090:9090"
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:9090/actuator/health",
        ]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - silverwind-network

  # Angular Frontend with Nginx
  frontend:
    build:
      context: ./silverwind-frontend
      dockerfile: Dockerfile
    container_name: silverwind-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:80/health",
        ]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
      - silverwind-network

volumes:
  dbdata:
    driver: local
  qdrant_storage:
    driver: local
  uploads:
    driver: local

networks:
  silverwind-network:
    driver: bridge
