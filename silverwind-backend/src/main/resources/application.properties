spring.application.name=silverwind

server.port=9090

# ---------------- Logging ----------------
logging.level.com.solventek.silverwind=INFO

# ---------------- DB ----------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/solventek_silverwind}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:8080}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# ---------------- HikariCP Connection Pool ----------------
# Optimized for t3.medium (2 vCPUs)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.placeholders.ignore=true

spring.flyway.validate-on-migrate=false

# ---------------- Spring AI (Google GenAI - Chat) ----------------
spring.ai.google.genai.api-key=${GOOGLE_AI_API_KEY:AIzaSyAKh_lu7HinTn_RS5cvXCQGSKjq66udV-0}
spring.ai.google.genai.chat.options.model=gemini-2.5-flash
spring.ai.google.genai.chat.options.temperature=0.1
spring.ai.google.genai.project-id=local-dev

# ---------------- Spring AI (Google GenAI - Embeddings) ----------------
# Use Google GenAI embeddings model (defaults to google-genai, but explicit is fine)
spring.ai.model.embedding.text=google-genai

# You can set api-key here too (docs show embedding.* prefix),
# even though connection can be shared with chat.
spring.ai.google.genai.embedding.api-key=${GOOGLE_AI_API_KEY:AIzaSyAKh_lu7HinTn_RS5cvXCQGSKjq66udV-0}
spring.ai.google.genai.embedding.text.options.model=gemini-embedding-001
# ---------------- Spring AI (Qdrant Vector Store) ----------------
spring.ai.vectorstore.qdrant.host=localhost
spring.ai.vectorstore.qdrant.port=6334
spring.ai.vectorstore.qdrant.collection-name=silverwind
spring.ai.vectorstore.qdrant.initialize-schema=true

# ---------------- App Custom (JWT) ----------------
app.jwt.secret=${APP_JWT_SECRET:9a4f2c8d3b7a1e6f4a5d0c3b2a1e9d8c7b6a5e4d2a1b9c8d3e5f7a0c1b4d2e6f}
app.jwt.expiration-ms=86400000

# ---------------- AWS S3 Configuration ----------------
aws.s3.enabled=${AWS_S3_ENABLED:false}
aws.s3.bucket-name=${AWS_S3_BUCKET:solventek-silverwind}
aws.s3.region=${AWS_REGION:eu-north-1}
aws.s3.access-key=${AWS_ACCESS_KEY_ID:}
aws.s3.secret-key=${AWS_SECRET_ACCESS_KEY:}
aws.s3.presigned-url-expiration-minutes=60

# ---------------- Local Storage Fallback ----------------
app.storage.upload-dir=uploads

# ---------------- Mail Configuration ----------------
spring.mail.host=smtp.bizmail.yahoo.com
spring.mail.port=465
spring.mail.username=hr.alerts@solventek.com
spring.mail.password=tapuejfyqlkhuctl
spring.mail.protocol=smtps
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=*

# ---------------- File Upload ----------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB


